<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.1.1/css/pro.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="view">
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="login-container">
                <div class="title">Log In</div>
                <div class="line"></div>
                <div class="inputs-wrapper">
                    <div class="input-container">
                        <div class="input-title">User name</div>
                        <input type="text" placeholder="Enter name" id="username" readonly="true">
                    </div>
                    <div class="input-container">
                        <div class="input-title" id="pswrdtitle">Password</div>
                        <input type="text" placeholder="Enter password" id="password">
                    </div>
                </div>
                <div class="btn">Confirm</div>
            </div>
            <div class="ban-container">
                <i class="fa-solid fa-ban"></i>
                <span>You have been banned</span>
            </div>
            <div class="success-container">
                <i class="fa-solid fa-check"></i>
                <span>Logged In!</span>
            </div>
        </div>
        <div class="pass">Skakanka 1</div>
    </div>
</body>
<script src="script.js"></script>

</html>
